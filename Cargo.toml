[workspace]
resolver = "3"
members = [
  "packages/api",
  "packages/db",
  "packages/model",
  "packages/readability"
]

[workspace.dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "derive", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
