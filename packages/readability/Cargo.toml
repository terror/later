[package]
name = "readability"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
regex = "1.9"
url = "2.4"
html5ever = "0.26"
markup5ever_rcdom = "0.2"
lazy_static = "1.4"
thiserror = "1.0"

[dependencies.reqwest]
version = "0.11"
optional = true
features = ["blocking", "rustls-tls"]
default-features = false

[features]
default = ["reqwest"]
