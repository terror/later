[package]
name = "db"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
model = { path = "../model" }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid"] }
thiserror = "2.0.17"

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.4"
