[package]
name = "db"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false }
model = { path = "../model", features = ["sqlx"] }
sqlx = { workspace = true }
thiserror = "2.0.17"
uuid = "1.29.3"

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.4"
