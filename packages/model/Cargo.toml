[package]
name = "model"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.39", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.226", features = ["derive"] }
utoipa = { version = "5.4.0", features = ["chrono", "uuid"] }
uuid = { version = "1.11.0", features = ["serde"] }
sqlx = { workspace = true, optional = true }
tsify = { version = "0.5.8", optional = true }
wasm-bindgen = { version = "=0.2.128", optional = true }

[features]
sqlx = ["dep:sqlx"]
tsify = ["dep:tsify", "dep:wasm-bindgen"]

[dev-dependencies]
serde_json = "1.0.154"
