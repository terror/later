[package]
name = "api"
description = "A self-hostable read-it-later service"
edition = "2024"
version = "0.1.0"

[dependencies]
aide = { version = "0.15.1", features = ["axum", "scalar"] }
anyhow = "1.0.100"
async-session = "3.0.0"
axum = "0.8.4"
axum-extra = { version = "0.10.1", features = ["typed-header"] }
clap = { version = "4.5.48", features = ["derive"] }
dotenv = "0.15.0"
http = "1.3.1"
oauth2 = "5.0.0"
redis = { version = "0.32.5", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12.23", features = ["json"] }
serde = { version = "1.0.226", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
